services:
  salep-api-main:
    image: ghcr.io/brianwibowo/salep_ic-backend-main:${IMAGE_TAG:-main}
    container_name: salep-api-main
    ports:
      - "127.0.0.1:8099:8000"
    env_file:
      - /opt/salep/main/backend.env
    volumes:
      - /opt/salep/main/data:/app/data
      - /opt/salep/main/service-account.json:/app/service-account.json:ro
    restart: unless-stopped
