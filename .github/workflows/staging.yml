name: Staging CI/CD

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: brianwibowo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    name: Build staging images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR for image publishing
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/salep_ic-backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/salep_ic-backend:staging
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL }}
            NEXT_PUBLIC_API_URL_INVENTORY=${{ vars.STAGING_API_URL_INVENTORY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/salep_ic-frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/salep_ic-frontend:staging

  cd:
    name: Deploy staging with Docker Compose
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          port: ${{ secrets.STAGING_DEPLOY_PORT }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_DEPLOY_FINGERPRINT }}
          source: deploy/docker-compose.staging.yml
          target: /opt/salep/staging
      - name: Pull and restart staging stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          port: ${{ secrets.STAGING_DEPLOY_PORT }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_DEPLOY_FINGERPRINT }}
          script: |
            set -Eeuo pipefail
            cd /opt/salep/staging
            export IMAGE_TAG='${{ github.sha }}'
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f
